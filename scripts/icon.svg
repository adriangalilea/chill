<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" color="#dff3ff">
  <!-- chill: a three-blade fan drawn in strokes, cool ink on a deep plate.
       ONE hue, alpha is the only variable (blades 1.0, hub .55). The mark
       is the drawing: rsvg-convert renders icns + icon.png from it (`mise
       icon`) and the menu bar glyph is a template render of the same paths. -->
  <defs>
    <radialGradient id="plate" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#173a52"/>
      <stop offset="1" stop-color="#07131c"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)"/>

  <g fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- three blades, one shape rotated by 120 -->
    <path d="M 512 430 Q 462 300 522 176 Q 606 296 512 430 Z"/>
    <path d="M 512 430 Q 462 300 522 176 Q 606 296 512 430 Z" transform="rotate(120 512 512)"/>
    <path d="M 512 430 Q 462 300 522 176 Q 606 296 512 430 Z" transform="rotate(240 512 512)"/>
    <!-- the hub -->
    <circle cx="512" cy="512" r="52" opacity="0.55"/>
  </g>
</svg>
