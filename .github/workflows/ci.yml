# The only thing CI does. Releasing needs a signing certificate and a notary
# key, so it happens locally (`mise run release`); nothing here touches a secret.
# The gate: format-clean (swift-format changes nothing) + 0 warnings.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@badac2986df2893b941df9d924f0b22bcb4e1a76 # v2.0.0
    permissions:
      contents: read
