# chill: fan control with Apple in charge by default. The verbs (`mise <task>`
# from the app dir; install/uninstall collide with mise builtins, so those
# two are always `mise run install` / `mise run uninstall`):
#   build      both binaries (release): chill (app + CLI) and chilld (the root daemon)
#   dev        the app from source (debug): ad-hoc signed, so no daemon is reachable, local sensors only
#   demo       the app in the demo world: forked -demo roots, an in-process daemon, never chilld
#   scene      the @ag/macos stage scenes into the garden, the popover clip onto the CDN
#   check      format + compile everything, debug: the FAST typecheck (0 warnings)
#   format     swift-format in place · lint: advisory
#   icon       chill.icon (Icon Composer, SVG layers) → Assets.car + chill.icns + icon.png (swift-utils' mark)
#   install    /Applications/chill.app, Developer ID signed, chilld registered, `chill` on PATH
#   uninstall  `chill daemon uninstall` first, then the bundle and the symlink
#   notes      draft notes/$VERSION.md from the commits (you then rewrite it)
#   release    `ship release` (swift-utils): signed, notarized dmg → tag → GitHub Release → publish → cask ($TAP)
#   ship-check what would stop a release right now, each blocked gate with its real answer
#   publish    dmg → R2 behind chill.untitled.garden/releases (the COUNTED url) + notes → garden ($GARDEN)
#   clean      remove the build directory and dist
# Every compiling task runs under scripts/locked.sh (the build mutex);
# scripts/assemble.sh builds the .app for install AND release, one implementation.

[env]
# THE VERSION, single source of truth: it stamps Info.plist and names the tag.
VERSION = "0.1.10"
# /Applications, never ~/Applications: launchd bootstraps the daemon at boot,
# before any home directory exists, and the cask lands here too, so a dev
# build never registers a second root daemon. The CLI is a symlink into the
# bundle so app, CLI and daemon stay ONE signed bundle.
APP = "/Applications/chill.app"
APPBIN = "/Applications/chill.app/Contents/MacOS/chill"
DIST = "dist"

[tasks.build]
description = "Build chill and chilld (release)"
run = "scripts/locked.sh swift build -c release"

[tasks.dev]
description = "The app from source (debug): no daemon reachable from a bare build, local sensors only; `mise run install` for the real daemon"
run = '''
scripts/locked.sh swift build
.build/debug/chill
'''

# The demo studio (the studio decree): every content-bearing root forked to
# a -demo sibling, sensors scripted, the daemon in-process. Safe to show.
[tasks.demo]
description = "The app in the demo world: forked roots, scripted sensors, no chilld"
run = '''
scripts/locked.sh swift build
.build/debug/chill --demo
'''

# The showcase, drawn by the app so it cannot drift from it: scenes on
# @ag/macos's MacBook, their timelines + art written into the garden, and
# the popover clips they open (rendered frame by frame on the film's clock)
# published beside awake's films on the CDN.
[tasks.scene]
description = "The stage scenes: timelines + art into the garden (and the ui studio when UI is set), the popover clips onto the CDN (needs ffmpeg, the garden checkout)"
# art.json carries the app icon, Resources/icon.png.
depends = ["icon"]
run = '''
set -e
garden="${GARDEN:?the scenes are written into the garden checkout: set GARDEN to it}"
test -d "$garden/tools/release" || { echo "GARDEN=$garden is not the garden checkout"; exit 1; }
scripts/locked.sh swift build
mkdir -p "$DIST/scenes"
set -- --out "$garden/apps/garden/components/scenes/chill"
if [ -n "$UI" ]; then set -- "$@" --out "$UI/public/macos/chill"; fi
.build/debug/chill --demo scene --cdn https://cdn.untitled.garden/media/chill/films \
  --films "$DIST/scenes" "$@"
pnpm --dir "$garden/tools/release" exec tsx film.ts chill "$PWD/$DIST"/scenes/*.mp4 "$PWD/$DIST"/scenes/*.jpg
'''

[tasks.format]
description = "swift-format in place (the Xcode toolchain's)"
run = "xcrun swift-format --recursive Sources/ --in-place"

[tasks.lint]
description = "swift-format lint, advisory (format-clean is the gate, not lint taste)"
run = "xcrun swift-format lint --recursive Sources/"

# Diagnostics are read, not hidden: a build that prints `warning:` fails.
[tasks.check]
description = "format + compile everything, debug: the FAST typecheck (must be 0 warnings)"
run = '''
mise run format
out=$(scripts/locked.sh swift build 2>&1) || { echo "$out"; exit 1; }
if echo "$out" | grep -q "warning:"; then echo "$out"; echo "chill: warnings are errors"; exit 1; fi
echo "chill: 0 errors, 0 warnings"
'''

# One drawing, every icon file: chill.icon (Icon Composer's package, its
# layers SVG) is the icon; swift-utils' `mark` compiles the glass
# Assets.car, the flat chill.icns and the site's icon.png from it, build
# output never committed (actool's is not byte-stable), so every task that
# bundles or shows the icon depends on this one. `mark preview chill.icon`
# is the review. Skipped while the package is unchanged.
[tasks.icon]
description = "Compile chill.icon: Resources/Assets.car + chill.icns + icon.png (swift-utils' mark)"
tools = { "spm:adriangalilea/swift-utils" = { version = "0.20.0", filter_bins = "mark,ship" } }
sources = ["chill.icon/icon.json", "chill.icon/Assets/*.svg"]
outputs = ["Resources/Assets.car", "Resources/chill.icns", "Resources/icon.png"]
run = "mark build chill.icon --out Resources --png Resources/icon.png"

# A Developer ID is REQUIRED, no ad-hoc fallback: SMAppService refuses an
# unsigned or ad-hoc bundle (kSMErrorInvalidSignature), and the daemon's
# peer requirement is derived from that signature's Team ID. Inner Mach-Os
# first (chilld, chill), then the bundle, whose seal covers the LaunchDaemons
# plist. The old registration goes BEFORE the old bundle: a bundle trashed
# first leaves a .notFound registration in Login Items.
[tasks.install]
description = "Build + install /Applications/chill.app (Developer ID), register chilld, `chill` on PATH"
depends = ["icon"]
run = '''
set -e
sign_id=$(security find-identity -v -p codesigning 2>/dev/null | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
test -n "$sign_id" || { echo "chill: no 'Developer ID Application' identity in the keychain; a LaunchDaemon bundle cannot be ad-hoc signed"; exit 1; }
mise run build
prefix="${PREFIX:-$HOME/.local}"
mkdir -p "$prefix/bin"
if [ -x "$APPBIN" ]; then "$APPBIN" daemon uninstall; fi
rm -rf "$APP"
scripts/assemble.sh "$APP"
codesign --force --options runtime --sign "$sign_id" "$APP/Contents/MacOS/chilld"
codesign --force --options runtime --sign "$sign_id" "$APP/Contents/MacOS/chill"
codesign --force --options runtime --sign "$sign_id" "$APP"
ln -sf "$APPBIN" "$prefix/bin/chill"
echo "installed $APP (+ chill on PATH)"
# The binary owns the registration (SMAppService + the login item), not this
# file: the popover's "install chilld" makes the same two for a cask install.
"$APPBIN" daemon install
'''

[tasks.uninstall]
description = "chill daemon uninstall, then remove the bundle and the symlink"
run = '''
set -e
prefix="${PREFIX:-$HOME/.local}"
if [ -x "$APPBIN" ]; then "$APPBIN" daemon uninstall; fi
rm -rf "$APP"
rm -f "$prefix/bin/chill"
echo "removed $APP and $prefix/bin/chill"
'''

[tasks.clean]
run = 'rm -rf .build "$DIST"'

# THE WORDS GATE: a release exists only once a human has written what changed.
# git-cliff DRAFTS from the commits; the draft is raw material, not prose users
# read. Rewrite it, commit it, and that file is the release notes forever.
[tasks.notes]
description = "Draft notes/$VERSION.md from the commits with git-cliff (then REWRITE it for humans)"
run = '''
command -v git-cliff >/dev/null || { echo "git-cliff missing: brew install git-cliff"; exit 1; }
notes="notes/$VERSION.md"
test ! -f "$notes" || { echo "$notes exists already: edit it"; exit 1; }
mkdir -p notes
git-cliff --config .github/cliff.toml --unreleased --tag "$VERSION" -o "$notes"
echo "drafted $notes: REWRITE it for humans, then commit it"
'''

# Notarization is a credentialed act, so releasing is a LOCAL command: the
# certificate is in this keychain and the App Store Connect key is named by
# this machine's environment (APPSTORE_KEY, APPSTORE_KEY_ID, APPSTORE_ISSUER),
# neither of which belongs in CI. CI's job is the 0-warning gate, nothing more.
[tasks.release]
description = "ship release: gates, Developer ID, notarized dmg, tag, GitHub Release, publish, cask (LOCAL: needs the Developer ID + APPSTORE_KEY)"
depends = ["icon", "check"]
# swift-utils' `ship`, one release for every app. A task tool, not [tools]: CI
# (mise check) never releases, so it never builds it.
tools = { "spm:adriangalilea/swift-utils" = { version = "0.20.0", filter_bins = "mark,ship" } }
run = '''
ship release --name chill --app "$DIST/chill.app" \
  --assemble "mise run build && scripts/assemble.sh $DIST/chill.app" \
  --sign Contents/MacOS/chilld --sign Contents/MacOS/chill \
  --github --after "mise run publish" --cask
'''

# Every gate the release would hold, each blocked one with its real answer.
[tasks.ship-check]
description = "ship check: what would stop a release right now"
depends = ["icon"]
tools = { "spm:adriangalilea/swift-utils" = { version = "0.20.0", filter_bins = "mark,ship" } }
run = '''
ship check --name chill --app "$DIST/chill.app" --assemble "scripts/assemble.sh $DIST/chill.app" \
  --github --after "mise run publish" --cask
'''

# The garden half of a release, ship's --after: the dmg behind the counted
# download URL, the notes on the surface. It runs BEFORE the cask bump: the
# cask's URL is this one, and brew fetches it the moment the tap updates. The
# untitled garden monorepo's release tool is the ONE writer to the R2 bucket
# behind <slug>.untitled.garden/releases/<file>, the download URL that is
# COUNTED (garden KPI `download`), and `pnpm garden notes` syncs notes/<v>.md
# to the surface's release rows. GARDEN names that checkout; unset (a fork),
# both are skipped and downloads simply go unmeasured.
[tasks.publish]
description = "dmg → R2 behind chill.untitled.garden/releases (the counted url) + notes → garden"
run = '''
dmg="$DIST/chill-$VERSION.dmg"
test -f "$dmg" || { echo "no $dmg: run 'mise release'"; exit 1; }
if [ -z "$GARDEN" ]; then echo "GARDEN is not set, skipping publish (downloads uncounted)"; exit 0; fi
test -d "$GARDEN/tools/release" || { echo "GARDEN=$GARDEN is not the garden checkout"; exit 1; }
url=$(pnpm --dir "$GARDEN/tools/release" exec tsx dmg.ts chill "$PWD/$dmg") && echo "published $url"
cd "$GARDEN" && pnpm --silent garden notes chill
'''
